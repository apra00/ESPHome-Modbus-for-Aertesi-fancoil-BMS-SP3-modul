################################################################################
# ESPHome Configuration -- Aertesi BMS-SP3 Fancoil Controller
# Hardware : ESP32-C3 + RS485 TTL board
# UART     : GPIO20 = RX (ESP),  GPIO21 = TX (ESP)
# Protocol : Modbus RTU, 9600 baud, ODD, 1 parity
# HA       : Auto-discovered via native ESPHome API
#
# ── REPO LAYOUT ──────────────────────────────────────────────────────────────
#  Commit these three files to the repo root:
#    components/fancoil_climate/__init__.py   (empty)
#    components/fancoil_climate/climate.py
#    components/fancoil_climate/fancoil_climate.h
#  ESPHome fetches them automatically via the external_components entry below.
#
# ── HOW WRITES WORK (S7) ─────────────────────────────────────────────────────
#  ALL 8 R/W registers (addrs 1096-1103) MUST be written as ONE FC16 command.
#  The SP3 only supports FC03 and FC16 (S5).
#
#  write_all_registers is the SOLE write path: FC16, addr 1096, 8 regs.
#
#  g_write_lock (bool) is set true before any write and cleared 1 s later by
#  unlock_write_lock (mode: restart).  While true, raw_* sensor on_value
#  callbacks skip global updates so a stale in-flight FC03 response cannot
#  race against the freshly issued FC16 command.
#
#  HVAC mode → SP3 registers
#    off       → g_system_status = 0  (OFF Forced)
#    cool      → g_system_status = 2, g_operation_mode = 0  (Summer)
#    heat      → g_system_status = 2, g_operation_mode = 1  (Winter)
#    auto      → g_system_status = 2, g_operation_mode = 2  (Automatic)
#    fan_only  → g_system_status = 1  (ON/OFF from Keyboard)
#
#  Fan mode → g_fan_speed
#    auto → 4 | low → 1 | medium → 2 | high → 3
################################################################################

substitutions:
  device_name: fancoil-bedroom
  friendly_name: "Fancoil Bedroom"
  modbus_address: "1"
  setpoint_min: "16"
  setpoint_max: "30"

external_components:
  - source: github://apra00/ESPHome-Modbus-for-Aertesi-fancoil-BMS-SP3-modul@main
    components: [ fancoil_climate ]
    refresh: 1s

globals:
  - id: g_system_status       # addr 1096
    type: int
    restore_value: true
    initial_value: '1'        # 1 = ON/OFF from keyboard
  - id: g_operation_mode      # addr 1097
    type: int
    restore_value: true
    initial_value: '2'        # 2 = Automatic
  - id: g_fan_speed           # addr 1098
    type: int
    restore_value: true
    initial_value: '4'        # 4 = Auto
  - id: g_setpoint            # addr 1099  (raw x10, e.g. 210 = 21.0 °C)
    type: int
    restore_value: true
    initial_value: '210'
  - id: g_setpoint_priority   # addr 1102
    type: int
    restore_value: true
    initial_value: '1'        # 1 = supervision system
  - id: g_supervision_active  # addr 1103
    type: int
    restore_value: false
    initial_value: '1'
  - id: g_write_lock
    type: bool
    restore_value: false
    initial_value: 'false'

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - delay: 5s
      - script.execute: write_all_registers

esp32:
  board: esp32-c3-devkitm-1
  framework:
    type: arduino

logger:
  baud_rate: 0

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  output_power: 10dB # due to the ESP32-C3 being sensitive to overpowered WiFI
  manual_ip:
    static_ip: 192.168.x.x
    gateway: 192.168.x.1
    subnet: 255.255.255.0
    dns1: 8.8.8.8
    dns2: 1.1.1.1

api:
  encryption:
    key: !secret api_encryption_key

ota:
  platform: esphome
  password: !secret ota_password

uart:
  id: modbus_uart
  rx_pin: GPIO20
  tx_pin: GPIO21
  baud_rate: 9600
  data_bits: 8
  parity: ODD
  stop_bits: 1

modbus:
  id: modbus_bus
  uart_id: modbus_uart
  # flow_control_pin: GPIOX

modbus_controller:
  - id: fancoil
    address: ${modbus_address}
    modbus_id: modbus_bus
    setup_priority: -10
    update_interval: 5s
    command_throttle: 100ms

################################################################################
# SCRIPTS
################################################################################

script:

  - id: write_all_registers
    then:
      - lambda: |-
          id(g_write_lock) = true;
      - lambda: |-
          std::vector<uint16_t> payload = {
            (uint16_t) id(g_system_status),      // addr 1096
            (uint16_t) id(g_operation_mode),     // addr 1097
            (uint16_t) id(g_fan_speed),          // addr 1098
            (uint16_t) id(g_setpoint),           // addr 1099  (x10)
            0,                                   // addr 1100  not used
            0,                                   // addr 1101  not used
            (uint16_t) id(g_setpoint_priority),  // addr 1102
            (uint16_t) id(g_supervision_active), // addr 1103
          };
          modbus_controller::ModbusCommandItem cmd =
            modbus_controller::ModbusCommandItem::create_write_multiple_command(
              id(fancoil), 1096, 8, payload);
          id(fancoil)->queue_command(cmd);
      - script.execute: unlock_write_lock

  - id: unlock_write_lock
    mode: restart
    then:
      - delay: 1s
      - lambda: 'id(g_write_lock) = false;'

################################################################################
# CLIMATE
################################################################################

climate:
  - platform: fancoil_climate
    name: "${friendly_name}"
    id: climate_fancoil
    on_control:
      # `x` is ClimateCall & -- the standard ESPHome base climate variable.
      - lambda: |-
          // 1. Acquire write lock before touching any global.
          id(g_write_lock) = true;

          // 2. HVAC mode
          if (x.get_mode().has_value()) {
            switch (*x.get_mode()) {
              case climate::CLIMATE_MODE_OFF:
                id(g_system_status) = 0;
                break;
              case climate::CLIMATE_MODE_COOL:
                id(g_system_status)  = 2;
                id(g_operation_mode) = 0;
                break;
              case climate::CLIMATE_MODE_HEAT:
                id(g_system_status)  = 2;
                id(g_operation_mode) = 1;
                break;
              case climate::CLIMATE_MODE_AUTO:
                id(g_system_status)  = 2;
                id(g_operation_mode) = 2;
                break;
              case climate::CLIMATE_MODE_FAN_ONLY:
                id(g_system_status) = 1;
                break;
              default:
                break;
            }
          }

          // 3. Fan mode
          if (x.get_fan_mode().has_value()) {
            switch (*x.get_fan_mode()) {
              case climate::CLIMATE_FAN_LOW:    id(g_fan_speed) = 1; break;
              case climate::CLIMATE_FAN_MEDIUM: id(g_fan_speed) = 2; break;
              case climate::CLIMATE_FAN_HIGH:   id(g_fan_speed) = 3; break;
              default:                          id(g_fan_speed) = 4; break;
            }
          }

          // 4. Setpoint
          if (x.get_target_temperature().has_value())
            id(g_setpoint) = (int)(*x.get_target_temperature() * 10.0f);

          // 5. Send FC16 with all 8 registers.
          id(write_all_registers).execute();

################################################################################
# SENSORS
################################################################################

sensor:

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "Air Temperature (Keyboard Probe)"
    id: sensor_air_temp
    address: 1066
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1
    on_value:
      then:
        - lambda: |-
            if (id(g_write_lock)) return;
            id(climate_fancoil).sync_from_globals(
              id(g_system_status), id(g_operation_mode),
              id(g_fan_speed), id(g_setpoint), x);

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "Water Temperature"
    address: 1129
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "Active Setpoint"
    address: 1239
    register_type: holding
    value_type: S_WORD
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "PWM AO1 Output"
    address: 1238
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    filters:
      - multiply: 0.1

  # ── Internal: keep globals, selects, and climate card in sync after polls ──

  - platform: modbus_controller
    modbus_controller_id: fancoil
    id: raw_system_status
    address: 1096
    register_type: holding
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(g_write_lock)) return;
            id(g_system_status) = (int)x;
            id(climate_fancoil).sync_from_globals(
              id(g_system_status), id(g_operation_mode),
              id(g_fan_speed), id(g_setpoint),
              id(sensor_air_temp).state);
        - if:
            condition:
              lambda: 'return !id(g_write_lock);'
            then:
              - component.update: ctrl_system_status

  - platform: modbus_controller
    modbus_controller_id: fancoil
    id: raw_operation_mode
    address: 1097
    register_type: holding
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(g_write_lock)) return;
            id(g_operation_mode) = (int)x;
            id(climate_fancoil).sync_from_globals(
              id(g_system_status), id(g_operation_mode),
              id(g_fan_speed), id(g_setpoint),
              id(sensor_air_temp).state);
        - if:
            condition:
              lambda: 'return !id(g_write_lock);'
            then:
              - component.update: ctrl_operation_mode

  - platform: modbus_controller
    modbus_controller_id: fancoil
    id: raw_fan_speed
    address: 1098
    register_type: holding
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(g_write_lock)) return;
            id(g_fan_speed) = (int)x;
            id(climate_fancoil).sync_from_globals(
              id(g_system_status), id(g_operation_mode),
              id(g_fan_speed), id(g_setpoint),
              id(sensor_air_temp).state);
        - if:
            condition:
              lambda: 'return !id(g_write_lock);'
            then:
              - component.update: ctrl_fan_speed

  - platform: modbus_controller
    modbus_controller_id: fancoil
    id: raw_setpoint
    address: 1099
    register_type: holding
    value_type: S_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(g_write_lock)) return;
            id(g_setpoint) = (int)x;
            id(climate_fancoil).sync_from_globals(
              id(g_system_status), id(g_operation_mode),
              id(g_fan_speed), id(g_setpoint),
              id(sensor_air_temp).state);
        - if:
            condition:
              lambda: 'return !id(g_write_lock);'
            then:
              - component.update: ctrl_setpoint

  - platform: modbus_controller
    modbus_controller_id: fancoil
    id: raw_setpoint_priority
    address: 1102
    register_type: holding
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(g_write_lock)) return;
            id(g_setpoint_priority) = (int)x;
        - if:
            condition:
              lambda: 'return !id(g_write_lock);'
            then:
              - component.update: ctrl_setpoint_priority

  - platform: modbus_controller
    modbus_controller_id: fancoil
    id: raw_supervision_active
    address: 1103
    register_type: holding
    value_type: U_WORD
    internal: true
    on_value:
      then:
        - lambda: |-
            if (id(g_write_lock)) return;
            id(g_supervision_active) = (int)x;
        - if:
            condition:
              lambda: 'return !id(g_write_lock);'
            then:
              - component.update: ctrl_supervision_active

################################################################################
# BINARY SENSORS
################################################################################

binary_sensor:

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "Plant Running"
    address: 1227
    register_type: holding
    bitmask: 0x1
    device_class: running

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "Valve 1"
    address: 1164
    register_type: holding
    bitmask: 0x1
    device_class: opening

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "Too Cool Alarm"
    address: 1130
    register_type: holding
    bitmask: 0x1
    device_class: problem

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "Hot Start"
    address: 1131
    register_type: holding
    bitmask: 0x1

################################################################################
# TEXT SENSORS
################################################################################

text_sensor:

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "Fan Output Speed"
    address: 1166
    register_type: holding
    raw_encode: HEXBYTES
    entity_category: diagnostic
    lambda: |-
      uint16_t val = modbus_controller::word_from_hex_str(x, 0);
      switch (val) {
        case 0: return std::string("OFF");
        case 1: return std::string("Min");
        case 2: return std::string("Med");
        case 3: return std::string("Max");
        default: return str_sprintf("Unknown (%d)", val);
      }

  - platform: modbus_controller
    modbus_controller_id: fancoil
    name: "Heat|Cool Status"
    address: 1229
    register_type: holding
    raw_encode: HEXBYTES
    entity_category: diagnostic
    lambda: |-
      uint16_t val = modbus_controller::word_from_hex_str(x, 0);
      switch (val) {
        case 0: return std::string("Summer (Cooling)");
        case 1: return std::string("Winter (Heating)");
        default: return str_sprintf("Unknown (%d)", val);
      }

################################################################################
# SELECT
################################################################################

select:

  - platform: template
    name: "System Status"
    id: ctrl_system_status
    update_interval: never
    options:
      - "OFF Forced"
      - "ON/OFF from Keyboard"
      - "ON Forced"
    lambda: |-
      if (id(g_system_status) == 0) return std::string("OFF Forced");
      if (id(g_system_status) == 2) return std::string("ON Forced");
      return std::string("ON/OFF from Keyboard");
    set_action:
      - globals.set:
          id: g_system_status
          value: !lambda |-
            if (x == "OFF Forced") return 0;
            if (x == "ON Forced")  return 2;
            return 1;
      - script.execute: write_all_registers

  - platform: template
    name: "Operation Mode"
    id: ctrl_operation_mode
    update_interval: never
    options:
      - "Summer (Cooling)"
      - "Winter (Heating)"
      - "Automatic"
    lambda: |-
      if (id(g_operation_mode) == 0) return std::string("Summer (Cooling)");
      if (id(g_operation_mode) == 1) return std::string("Winter (Heating)");
      return std::string("Automatic");
    set_action:
      - globals.set:
          id: g_operation_mode
          value: !lambda |-
            if (x == "Summer (Cooling)") return 0;
            if (x == "Winter (Heating)") return 1;
            return 2;
      - script.execute: write_all_registers

  - platform: template
    name: "Fan Speed"
    id: ctrl_fan_speed
    update_interval: never
    options:
      - "From Keyboard"
      - "Min"
      - "Med"
      - "Max"
      - "Auto"
    lambda: |-
      switch (id(g_fan_speed)) {
        case 0:  return std::string("From Keyboard");
        case 1:  return std::string("Min");
        case 2:  return std::string("Med");
        case 3:  return std::string("Max");
        default: return std::string("Auto");
      }
    set_action:
      - globals.set:
          id: g_fan_speed
          value: !lambda |-
            if (x == "From Keyboard") return 0;
            if (x == "Min")           return 1;
            if (x == "Med")           return 2;
            if (x == "Max")           return 3;
            return 4;
      - script.execute: write_all_registers

  - platform: template
    name: "Setpoint Priority"
    id: ctrl_setpoint_priority
    update_interval: never
    entity_category: config
    options:
      - "Keyboard"
      - "Supervision System"
    lambda: |-
      if (id(g_setpoint_priority) == 0) return std::string("Keyboard");
      return std::string("Supervision System");
    set_action:
      - globals.set:
          id: g_setpoint_priority
          value: !lambda |-
            if (x == "Keyboard") return 0;
            return 1;
      - script.execute: write_all_registers

  - platform: template
    name: "Supervision Control"
    id: ctrl_supervision_active
    update_interval: never
    entity_category: config
    options:
      - "Disabled"
      - "Enabled"
    lambda: |-
      if (id(g_supervision_active) == 0) return std::string("Disabled");
      return std::string("Enabled");
    set_action:
      - globals.set:
          id: g_supervision_active
          value: !lambda |-
            if (x == "Disabled") return 0;
            return 1;
      - script.execute: write_all_registers

################################################################################
# NUMBER
################################################################################

number:

  - platform: template
    name: "Temperature Setpoint"
    id: ctrl_setpoint
    min_value: ${setpoint_min}
    max_value: ${setpoint_max}
    step: 0.5
    unit_of_measurement: "°C"
    device_class: temperature
    mode: slider
    update_interval: never
    lambda: 'return id(g_setpoint) / 10.0f;'
    set_action:
      - globals.set:
          id: g_setpoint
          value: !lambda 'return (int)(x * 10.0f);'
      - script.execute: write_all_registers
